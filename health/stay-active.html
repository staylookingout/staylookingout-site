<style>

    --white:#f4f4f2;--mute:#8c8c8c;--dim:#5a5a5a;--yellow:#E4FF1A;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
  html{scroll-behavior:smooth;touch-action:pan-y}
  body{background:var(--black);color:var(--white);font-family:'Oswald',system-ui,sans-serif;

    -webkit-text-stroke:1px rgba(0,0,0,.35)}

  .stack{padding:24px 0 64px}
  .pw{margin:0 auto 24px;width:100%}
  .panel{position:relative;background:var(--panel);border:2px solid var(--line);
    box-shadow:0 22px 40px -26px #000, inset 0 1px 0 rgba(255,255,255,.05);padding:30px 24px;
    opacity:0;translate:0 24px;transition:opacity .5s ease, translate .5s cubic-bezier(.2,.9,.2,1);}

    75%{box-shadow:0 0 18px rgba(228,255,26,.18), 0 0 36px rgba(228,255,26,.08)}
    100%{box-shadow:0 0 12px rgba(228,255,26,.1), 0 0 24px rgba(228,255,26,0)}

  .tin{flex:1;min-width:180px;font-family:'Oswald';font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    font-size:21px;color:var(--white);background:transparent;border:0;border-bottom:2px solid var(--line2);
    padding:12px 2px;outline:none}

  .tin:focus{border-bottom-color:var(--white)}

    transition:all 0.15s ease!important;-webkit-tap-highlight-color:transparent!important;outline:none!important}

  .btn.share:active{background:#E4FF1A!important;color:#000!important;border-color:#E4FF1A!important;

  .quick{margin-top:22px}
  .quick .ql{margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{font-family:'Oswald';font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px;
    background:transparent;color:var(--white);border:2px solid var(--line2);padding:10px 15px;cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
  .chip:hover{background:var(--white);color:#000;border-color:var(--white)}
  .chip:active{background:var(--yellow);color:#000;border-color:var(--yellow);transform:translateY(1px)}
  .chip:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

  .ex-log:active{transform:scale(.9)}

  .entry .ev{font-family:'Anton';font-size:28px;line-height:.95}
  .entry .es{font-family:'Oswald';font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--mute);margin-top:6px}

  .log-tot{text-align:right;line-height:.9}

  .entry{cursor:pointer;user-select:none;-webkit-user-select:none}
  .entry.removing{opacity:0;transition:opacity .16s ease}
  .entry:active .en{color:var(--yellow)}
  .hle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}

  .hn{font-family:'Anton';font-size:24px;line-height:.95}
  .hv{font-family:'Anton';font-size:24px;color:var(--yellow);line-height:.95}

  footer{text-align:center;padding:30px 16px 52px;color:var(--dim);font-family:'Anton';letter-spacing:.3em;font-size:19px}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .panel{transition:none;opacity:1;translate:0 0}
    .rep-btn.rolling{animation:none}
    .btn,.chip,.rep-btn,.logbtn,.ex-log{transition:none}
    .rep-btn{animation:none}
  }

</style>
</head>

  var history=[];       // {name, sets, total, time}
  var activeEx=null;
  var state='home', prevState='home';
  var uid=0, hid=0, lastQuote=-1;

  function rand(a,b){return a+Math.random()*(b-a);}
  function pad2(n){return (n<10?'0':'')+n;}
  function total(ex){var t=0;for(var i=0;i<ex.sets.length;i++)t+=ex.sets[i];return t;}
  function haptic(s){ if(navigator.vibrate){try{navigator.vibrate(s?[16,38,24]:12);}catch(e){}} }
  function nowTime(){var d=new Date();var h=d.getHours(),m=d.getMinutes();var ap=h<12?'AM':'PM';h=h%12;if(h===0)h=12;return h+':'+pad2(m)+' '+ap;}

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function escq(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function setTickerSpeed(){
    var SPEED=115; // px per second — readable but lively
    var w=track.scrollWidth/2;
    if(w>0) track.style.animationDuration=Math.max(w/SPEED,8).toFixed(1)+'s';
  }
  function buildTicker(){
    var seq=shuffle(QUOTES).map(function(q){
      return '<span class="qi">'+escq(q.text)+'</span><span class="qsep">\u2726</span>';
    }).join('');
    track.innerHTML=seq+seq;   // two identical copies -> seamless -50% loop
    setTickerSpeed();
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(setTickerSpeed); }
    setTimeout(setTickerSpeed,400);
  }

  /* ---- FX ---- */
  function ring(cx,cy,size,big){
    var el=document.createElement('span'); el.className='ring';
    el.style.left=cx+'px';el.style.top=cy+'px';el.style.width='12px';el.style.height='12px';
    fx.appendChild(el);
    if(reduce){setTimeout(function(){el.remove();},150);return;}
    el.animate([{width:'12px',height:'12px',opacity:.95,borderWidth:'4px'},
      {width:size+'px',height:size+'px',opacity:0,borderWidth:'1px'}],
      {duration:big?560:430,easing:'cubic-bezier(.15,.8,.3,1)'}).onfinish=function(){el.remove();};
  }
  function word(cx,cy,txt,big){
    var el=document.createElement('span'); el.className='pow anton'; el.textContent=txt;
    el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.fontSize=(big?rand(66,88):rand(38,54))+'px';
    el.style.color=Math.random()<.25?'#bdbdbd':'#f4f4f2';
    el.style.transform='translate(-50%,-50%) rotate('+rand(-8,8)+'deg) scale(.4)';
    fx.appendChild(el);
    if(reduce){el.style.transform='translate(-50%,-50%)';setTimeout(function(){el.remove();},260);return;}
    var dx=rand(-26,26),dy=rand(-72,-120);
    el.animate([{transform:'translate(-50%,-50%) rotate('+rand(-8,8)+'deg) scale(.4)',opacity:0},
      {transform:'translate(calc(-50% + '+(dx*.4)+'px),calc(-50% + '+(dy*.4)+'px)) scale(1.12)',opacity:1,offset:.3},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(1)',opacity:0}],
      {duration:big?760:620,easing:'cubic-bezier(.15,.85,.25,1)'}).onfinish=function(){el.remove();};
  }
  function fxAt(btn,big,txt){
    var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    ring(cx,cy,big?300:190,big);
    word(cx+rand(-12,12),cy+rand(-8,8),txt||WORDS[Math.floor(rand(0,WORDS.length))],big);
  }

  /* ---- workout ---- */
  function refresh(ex){
    if(ex.cur==null||ex.cur<0||ex.cur>=ex.sets.length) ex.cur=ex.sets.length-1;
    var wrap=ex.el.querySelector('.sets'); wrap.innerHTML='';
    ex.sets.forEach(function(v,i){
      var s=document.createElement('div');
      s.className='set'+(i===ex.cur?' active':'');
      s.innerHTML='<span class="sn">Set '+(i+1)+'</span><span class="sv">'+v+'</span>';
      bindSet(s,ex,i);
      wrap.appendChild(s);
    });
    ex.el.querySelector('.ex-total .n').textContent=total(ex);
  }
  function addRep(ex,btn){
    if(ex.cur==null||ex.cur>=ex.sets.length) ex.cur=ex.sets.length-1;
    ex.sets[ex.cur]++;
    var reps=ex.sets[ex.cur], big=(reps%10===0);
    fxAt(btn,big,big?('×'+reps):null); haptic(big); refresh(ex);
  }
  function removeSet(ex,index){
    ex.sets.splice(index,1);
    if(!ex.sets.length){ ex.sets=[0]; ex.cur=0; }
    else { if(ex.cur>index) ex.cur--; if(ex.cur>=ex.sets.length) ex.cur=ex.sets.length-1; }
    haptic(true); refresh(ex);
  }
  function bindSet(el,ex,index){
    var t=null,longFired=false,sx=0,sy=0;
    function clr(){ if(t){clearTimeout(t);t=null;} }
    el.addEventListener('pointerdown',function(e){
      longFired=false; sx=e.clientX; sy=e.clientY;
      if(e.pointerId!=null&&el.setPointerCapture){try{el.setPointerCapture(e.pointerId);}catch(err){}}
      t=setTimeout(function(){ longFired=true; removeSet(ex,index); },500);
    });
    el.addEventListener('pointermove',function(e){ if(t&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))clr(); });
    el.addEventListener('pointerup',function(){ clr(); if(!longFired){ ex.cur=index; refresh(ex); } });
    el.addEventListener('pointercancel',clr);
  }
  function bindRoll(btn,ex){
    var rt=null,ri=null,rolling=false;
    function start(){ if(rolling)return; rolling=true; btn.classList.add('rolling'); ri=setInterval(function(){addRep(ex,btn);},100); }
    function stop(){ if(rt){clearTimeout(rt);rt=null;} if(ri){clearInterval(ri);ri=null;}
      if(rolling){rolling=false;btn.classList.remove('rolling'); if(navigator.vibrate){try{navigator.vibrate(0);}catch(e){}}} }
    btn.addEventListener('pointerdown',function(e){ if(e.cancelable)e.preventDefault();
      if(e.pointerId!=null&&btn.setPointerCapture){try{btn.setPointerCapture(e.pointerId);}catch(err){}}
      addRep(ex,btn); rt=setTimeout(start,280); });
    btn.addEventListener('pointerup',stop); btn.addEventListener('pointercancel',stop);
    btn.addEventListener('pointerleave',stop); window.addEventListener('blur',stop);
    btn.addEventListener('keydown',function(e){ if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();addRep(ex,btn);start();} });
    btn.addEventListener('keyup',function(e){ if(e.key===' '||e.key==='Enter')stop(); });
  }

  function startWorkout(name, presetSets, editId){
    activeEl.innerHTML='';
    var ex={id:++uid,name:name.toUpperCase(),sets:(presetSets&&presetSets.length?presetSets.slice():[0]),el:null,editId:editId||null};
    var pw=document.createElement('div'); pw.className='pw';
    var panel=document.createElement('div'); panel.className='panel';
    panel.innerHTML=
      '<div class="ex-top"><div class="ex-name anton"></div>'+
      '<button class="ex-log" type="button" aria-label="'+(editId?'Save changes':'Add to log')+'">'+(editId?'\u2713':'+')+'</button></div>'+
      '<div class="ex-total"><span class="n">0</span><span class="cap">Total reps</span></div>'+
      '<div class="sets"></div>'+
      '<div class="ex-actions">'+
        '<button class="rep-btn anton" type="button" aria-label="Add a rep">HIT</button>'+
        '<button class="btn ghost sm newset" type="button">NEW SET</button>'+
      '</div>';
    panel.querySelector('.ex-name').textContent=ex.name;
    pw.appendChild(panel); ex.el=panel; activeEl.appendChild(pw); activeEx=ex;

    bindRoll(panel.querySelector('.rep-btn'),ex);
    panel.querySelector('.newset').addEventListener('click',function(){
      if(ex.sets[ex.sets.length-1]===0)return;
      haptic();
      ex.sets.push(0); ex.cur=ex.sets.length-1; refresh(ex);
    });
    panel.querySelector('.ex-log').addEventListener('click',function(){
      haptic();
      finishWorkout();
    });
    refresh(ex);

    homeEl.style.display='none'; logEl.style.display='none'; activeEl.style.display='';
    navlog.classList.remove('on'); state='active';
    requestAnimationFrame(function(){ panel.classList.add('in'); window.scrollTo({top:0,behavior:reduce?'auto':'smooth'}); });
  }

  function finishWorkout(){
    if(activeEx){
      var t=total(activeEx);
      if(activeEx.editId){
        for(var i=0;i<history.length;i++){ if(history[i].id===activeEx.editId){
          if(t>0){ history[i].sets=activeEx.sets.slice(); history[i].total=t; history[i].time=nowTime(); history[i].edited=true; }
          else { history.splice(i,1); }
          break;
        } }
      } else if(t>0){
        history.unshift({id:++hid, name:activeEx.name, sets:activeEx.sets.slice(), total:t, time:nowTime()});
      }
    }
    activeEx=null; activeEl.innerHTML=''; activeEl.style.display='none';
    goHome();
  }

  function goHome(){
    state='home'; activeEx=null; activeEl.innerHTML=''; activeEl.style.display='none';
    renderHomeLog();
    logEl.style.display='none'; homeEl.style.display=''; navlog.classList.remove('on');
    window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  }
  
  function randomizeFeaturedChip(){
    if(chips.length){
      chips.forEach(function(c){c.classList.remove('featured');});
      var randomIdx=Math.floor(Math.random()*chips.length);
      chips[randomIdx].classList.add('featured');
      localStorage.setItem('featuredChip',QUICK[randomIdx]);
    }
  }

  /* ---- log view ---- */
  function renderHomeLog(){
    var box=document.getElementById('homelog');
    if(!history.length){ box.innerHTML=''; return; }
    var rows=history.map(function(h){
      return '<div class="hle" data-id="'+h.id+'"><span class="hn">'+h.name+'</span><span class="hv">'+h.total+'</span></div>';
    }).join('');
    box.innerHTML='<div class="pw"><div class="panel in"><div class="ql label" style="margin-bottom:12px">Done today · tap to edit</div>'+rows+'</div></div>';
    box.querySelectorAll('.hle').forEach(function(el){
      el.addEventListener('click',function(){ editEntry(parseInt(el.getAttribute('data-id'),10)); });
    });
  }

  function editEntry(id){
    for(var i=0;i<history.length;i++){ if(history[i].id===id){ startWorkout(history[i].name, history[i].sets, id); return; } }
  }
  function bindEntry(el,id){
    el.addEventListener('click',function(){ editEntry(id); });
  }

  function renderLog(){
    var entries=document.getElementById('logentries');
    var g=0; for(var i=0;i<history.length;i++)g+=history[i].total;
    document.getElementById('logtot').textContent=g;
    document.getElementById('sharebtn').style.display=history.length?'':'none';
    entries.innerHTML='';
    if(!history.length){ entries.innerHTML='<div class="log-empty">Nothing logged yet. Go put in work.</div>'; return; }
    history.forEach(function(h){
      var setStr=h.sets.map(function(v,i){return (i+1)+'×'+v;}).join('   ');
      var e=document.createElement('div'); e.className='entry';
      e.innerHTML='<div class="et"><span class="en">'+h.name+'</span><span class="ev">'+h.total+'</span></div>'+
        '<div class="es">'+setStr+' <span class="etm">· '+h.time+(h.edited?' · edited':'')+'</span></div>';
      bindEntry(e,h.id);
      entries.appendChild(e);
    });
  }

  function shareWorkout(){
    if(!history.length) return;
    var g=0; history.forEach(function(h){g+=h.total;});
    var lines=history.map(function(h){ return h.name+' — '+h.total+' ('+h.sets.join(', ')+')'; });
    var text='staylookingout.com\n'+lines.join('\n')+'\nTotal: '+g+' reps\nSTAY ACTIVE.';
    try{
      if(navigator.share){ navigator.share({title:'STAY',text:text}).catch(function(){}); return; }
    }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){flashShare('Copied');},function(){flashShare('Copy failed');});
    }else{ flashShare('Not supported'); }
  }
  function flashShare(msg){
    var b=document.getElementById('sharebtn'); if(!b)return; var o=b.getAttribute('data-o')||b.textContent;
    b.setAttribute('data-o',o); b.textContent=msg; setTimeout(function(){b.textContent=o;},1400);
  }
  function toggleLog(){
    if(state!=='log'){
      prevState=state; homeEl.style.display='none'; activeEl.style.display='none';
      renderLog(); logEl.style.display=''; state='log'; navlog.classList.add('on');
      window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    }else{
      logEl.style.display='none'; navlog.classList.remove('on');
      if(prevState==='active' && activeEx){ activeEl.style.display=''; state='active'; }
      else { homeEl.style.display=''; state='home'; }
    }
  }
  navlog.addEventListener('click',function(){
    haptic();
    toggleLog();
  });
  var navhomeBtn=document.getElementById('navhome');
  var longPressTimer=null;
  var isLongPressing=false;
  var longPressInterval=null;
  
  navhomeBtn.addEventListener('mousedown',function(){
    isLongPressing=false;
    longPressTimer=setTimeout(function(){
      if(!longPressTimer) return;
      isLongPressing=true;
      longPressInterval=setInterval(function(){
        if(state==='home'){
          randomizeFeaturedChip();
          haptic();
        }
      },150);
    },300);
  });
  
  navhomeBtn.addEventListener('touchstart',function(){
    isLongPressing=false;
    longPressTimer=setTimeout(function(){
      if(!longPressTimer) return;
      isLongPressing=true;
      longPressInterval=setInterval(function(){
        if(state==='home'){
          randomizeFeaturedChip();
          haptic();
        }
      },150);
    },300);
  });
  
  function endLongPress(){
    if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
    if(longPressInterval){ clearInterval(longPressInterval); longPressInterval=null; }
    if(!isLongPressing){
      haptic();
      goHome();
      randomizeFeaturedChip();
    }
    isLongPressing=false;
  }
  
  navhomeBtn.addEventListener('mouseup',endLongPress);
  navhomeBtn.addEventListener('mouseleave',endLongPress);
  navhomeBtn.addEventListener('touchend',endLongPress);
  navhomeBtn.addEventListener('touchcancel',endLongPress);

  /* ---- home selector ---- */
  function tryAdd(){ var v=input.value.trim(); if(!v)return; haptic(); input.value=''; startWorkout(v); }
  document.getElementById('addbtn').addEventListener('click',tryAdd);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();tryAdd();} });
  var chipWrap=document.getElementById('chips');
  var chips=[];
  QUICK.forEach(function(name){
    var c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=name;
    c.addEventListener('click',function(){ 
      startWorkout(name);
      // save this as the featured chip
      chips.forEach(function(x){x.classList.remove('featured');});
      c.classList.add('featured');
      localStorage.setItem('featuredChip',name);
    });
    chipWrap.appendChild(c);
    chips.push(c);
  });
  
  // restore featured chip from last selection
  var savedFeatured=localStorage.getItem('featuredChip');
  if(savedFeatured && chips.length && savedFeatured!=='Push-ups'){
    var chipIdx=QUICK.indexOf(savedFeatured);
    if(chipIdx>=0 && chipIdx<chips.length){
      chips[chipIdx].classList.add('featured');
    }else{
      // if saved featured doesn't exist, default to Push-ups
      chips[0].classList.add('featured');
      localStorage.setItem('featuredChip','Push-ups');
    }
  }else if(chips.length){
    // first load or no saved data: default to Push-ups
    chips[0].classList.add('featured');
    localStorage.setItem('featuredChip','Push-ups');
  }

  document.getElementById('sharebtn').addEventListener('click',shareWorkout);
  
  // Blur buttons after click/touch to remove focus state on mobile
  document.querySelectorAll('.btn').forEach(function(btn){
    btn.addEventListener('click',function(){setTimeout(function(){btn.blur()},100)});
    btn.addEventListener('touchend',function(){setTimeout(function(){btn.blur()},100)});
  });

  /* ---- raindrop river background ---- */
  var canvas=document.getElementById('raindropCanvas');
  var ctx=canvas.getContext('2d');
  var raindrops=[];
  var time=0;
  
  function resizeCanvas(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  
  // initialize raindrops
  for(var i=0;i<80;i++){
    raindrops.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      vx:(Math.random()-0.5)*0.3,
      vy:(Math.random()-0.5)*0.2,
      radius:Math.random()*1.5+0.5,
      opacity:Math.random()*0.4+0.1
    });
  }
  
  function drawRaindrops(){
    time+=0.005;
    ctx.fillStyle='rgba(0,0,0,0.02)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    
    raindrops.forEach(function(drop){
      // perlin-like flow using sine/cosine waves
      var flowX=Math.sin(drop.y*0.003+time*0.3)*0.15;
      var flowY=Math.cos(drop.x*0.002+time*0.25)*0.1;
      
      // add slight random drift
      drop.vx+=flowX;
      drop.vy+=flowY+0.05; // slight downward bias
      
      // damping
      drop.vx*=0.98;
      drop.vy*=0.98;
      
      // update position
      drop.x+=drop.vx;
      drop.y+=drop.vy;
      
      // wrap around screen
      if(drop.x<-10)drop.x=canvas.width+10;
      if(drop.x>canvas.width+10)drop.x=-10;
      if(drop.y<-10)drop.y=canvas.height+10;
      if(drop.y>canvas.height+10)drop.y=-10;
      
      // oscillate opacity for living effect
      var opacityWave=Math.sin(time*0.8+drop.x*0.01)*0.2+drop.opacity;
      
      // draw drop with glow
      ctx.fillStyle='rgba(244,244,242,'+opacityWave+')';
      ctx.beginPath();
      ctx.arc(drop.x,drop.y,drop.radius,0,Math.PI*2);
      ctx.fill();
      
      // subtle glow
      ctx.strokeStyle='rgba(228,255,26,'+(opacityWave*0.3)+')';
      ctx.lineWidth=0.5;
      ctx.stroke();
    });
    
    requestAnimationFrame(drawRaindrops);
  }
  
  drawRaindrops();

  buildTicker(); renderHomeLog();
})();
