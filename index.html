<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>STAY Terminal — staylookingout.com</title>
<meta name="description" content="staylookingout/tools/ — instruments built in-house.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0a14;
    --fg:#e6e2f0;
    --dim:#6d6a86;
    --line:#2c2740;
    --pink:#ff7edb;
    --cyan:#36f9f6;
    --orange:#ff9a4d;
    --red:#fe5f75;
    --green:#72f1b8;
    --yellow:#fede5d;
    --purple:#b893e6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  a{color:var(--cyan);text-decoration:none;}
  a:hover{color:var(--pink);}

  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  @keyframes fadeIn{
    0%{opacity:0;text-shadow:0 0 0 rgba(54,249,246,0);}
    100%{opacity:1;text-shadow:0 0 12px rgba(54,249,246,0.6);}
  }
  @keyframes fadeOut{
    0%{opacity:1;}
    100%{opacity:0;}
  }

  #root{
    min-height:100vh;
    background:var(--bg);
    font-family:'JetBrains Mono',monospace;
    color:var(--fg);
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:text;
  }
  #root.in{animation:fadeIn 0.6s ease-out both;}
  #root.out{animation:fadeOut 0.4s ease-in forwards;}

  #wrap{
    width:100%;
    max-width:840px;
    padding:0 22px 60px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  #header{
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
    padding-top:44px;
  }
  @keyframes breathe{
    0%,100%{ text-shadow: 0 0 6px rgba(230,226,240,0.25), 0 0 16px rgba(54,249,246,0.12); }
    50%{ text-shadow: 0 0 14px rgba(230,226,240,0.5), 0 0 32px rgba(54,249,246,0.32), 0 0 52px rgba(255,126,219,0.14); }
  }
  #logo{
    font-family:'Special Gothic Condensed One', sans-serif;
    font-size:52px;
    line-height:1;
    letter-spacing:0.5px;
    color:#f2f0f8;
    margin-bottom:2px;
    user-select:none;
    display:block;
    animation: breathe 4.5s ease-in-out infinite;
  }
  #subtitle{color:var(--dim);font-size:13px;letter-spacing:1.5px;margin-bottom:26px;}

  .term-line{
    font-size:15px;
    line-height:1.85;
    word-break:break-word;
    padding:0 8px;
    margin:0 -8px;
    border-radius:3px;
    background:transparent;
  }
  .term-line.clickable{cursor:pointer;}
  .term-line span{white-space:pre-wrap;}

  #promptRow{
    display:flex;
    flex-wrap:wrap;
    font-size:15px;
    line-height:1.85;
    padding:0 8px;
    margin:2px -8px 0;
  }
  #promptRow.hidden{display:none;}
  #promptLabel{color:var(--green);white-space:pre;text-shadow:0 0 10px rgba(114,241,184,0.35);}
  #typedText{color:var(--fg);white-space:pre-wrap;}
  #caret{color:var(--cyan);animation:blink 1.1s steps(1) infinite;text-shadow:0 0 9px rgba(54,249,246,0.8);}
  #ghost{color:#443f5c;white-space:pre;}

  #mobileInput{
    position:fixed;bottom:0;left:0;
    width:2px;height:2px;
    opacity:0.01;
    border:none;background:transparent;color:transparent;caret-color:transparent;
  }
</style>
</head>
<body>
<div id="root" class="in">
  <div id="wrap">
    <div id="header">
      <div id="logo">STAY</div>
      <div id="subtitle">staylookingout/apps</div>
    </div>
    <div id="lines"></div>
    <div id="promptRow" class="hidden">
      <span id="promptLabel"></span>
      <span id="typedText"></span>
      <span id="caret">&#9608;</span>
      <span id="ghost"></span>
    </div>
  </div>
  <input id="mobileInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<script>
(function(){
  "use strict";

  var PAL = { pink:'#ff7edb', cyan:'#36f9f6', orange:'#ff9a4d', red:'#fe5f75', green:'#72f1b8', yellow:'#fede5d', purple:'#b893e6', dim:'#6d6a86', fg:'#e6e2f0' };
  var COLORS = ['#ff7edb','#36f9f6','#ff9a4d','#72f1b8','#fede5d','#b893e6','#fe5f75'];
  var GLYPHS = '!<>-_\\/[]{}=+*^?#@%&';
  var promptPath = '';
  var promptPathColor = PAL.yellow;

  // Directories shown at home
  var DIRECTORIES = [
    { name:'audio',  desc:'music tools' },
    { name:'camera', desc:'video/camera tools' },
    { name:'art',    desc:'visual creativity' },
    { name:'read',   desc:'essays & reflections' },
    { name:'learn',  desc:'courses & lessons' },
    { name:'health', desc:'body & fitness' },
    { name:'games',  desc:'play something' },
    { name:'tools',  desc:'utilities' }
  ];

  // Audio tools
  var AUDIO_PAGES = [
    { name:'chop',      url:'https://staylookingout.com/audio/chop.html',      desc:'in/out point' },
    { name:'bpmkey',    url:'https://staylookingout.com/audio/bpmkey.html',    desc:'BPM / key detection' },
    { name:'varispeed', url:'https://staylookingout.com/audio/varispeed.html', desc:'pitch/time stretch' },
    { name:'retune',    url:'https://staylookingout.com/audio/retune.html',    desc:'any song' },
    { name:'record',    url:'https://staylookingout.com/audio/record.html',    desc:'anything playing', color:'#fe5f75' },
    { name:'playlist',  url:'https://staylookingout.com/audio/playlist.html',  desc:'play/filter songs' },
    { name:'chordpad',  url:'https://staylookingout.com/audio/chordpad.html',  desc:'harmonic explorer' },
    { name:'groovelab', url:'https://staylookingout.com/audio/groovelab.html', desc:'rhythm patterns' }
  ];

  // Camera tools
  var CAMERA_PAGES = [
    { name:'slowmo',    url:'https://staylookingout.com/camera/slowmo.html',   desc:'playback sync for high-fps' },
    { name:'bmpcc',     url:'https://staylookingout.com/camera/rig/', desc:'BMPCC camera control app' }
  ];

  // Art tools
  var ART_PAGES = [
    { name:'character', url:'https://staylookingout.com/art/character-art-converter.html', desc:'tone grid & character art' }
  ];

  // Reading / lessons
  var READ_PAGES = [
    { name:'character', url:'https://staylookingout.com/read/character.html', desc:'people in religious text' },
    { name:'parable',   url:'https://staylookingout.com/read/parable.html',   desc:'lessons from around the world' }
  ];

  // Learning / courses
  var LEARN_PAGES = [
    { name:'mixlab', url:'https://staylookingout.com/learn/mix-lab-course.html', desc:'interactive mixing course' },
    { name:'waves',  url:'https://staylookingout.com/learn/waves.html',         desc:'light/audio relationship' }
  ];

  // General tools
  var TOOLS_PAGES = [
    { name:'optical',   url:'https://staylookingout.com/tools/optical-link.html', desc:'QR file transfer' }
  ];

  // Health / fitness
  var HEALTH_PAGES = [
    { name:'active',  url:'https://staylookingout.com/health/stay-active.html',  desc:'rep counter & workout log' },
    { name:'fasting', url:'https://staylookingout.com/health/stay-fasting.html', desc:'intermittent fasting timer' }
  ];

  // Games
  var GAMES_PAGES = [
    { name:'vector', url:'https://staylookingout.com/games/vector.html', desc:'vector void' }
  ];

  // All pages flattened for direct access from home
  var ALL_PAGES = AUDIO_PAGES.concat(CAMERA_PAGES, ART_PAGES, READ_PAGES, LEARN_PAGES, HEALTH_PAGES, GAMES_PAGES, TOOLS_PAGES);

  function currentPages(){
    if (promptPath === '')     return DIRECTORIES;
    if (promptPath === 'audio')  return AUDIO_PAGES;
    if (promptPath === 'camera') return CAMERA_PAGES;
    if (promptPath === 'art')    return ART_PAGES;
    if (promptPath === 'read')   return READ_PAGES;
    if (promptPath === 'learn')  return LEARN_PAGES;
    if (promptPath === 'health') return HEALTH_PAGES;
    if (promptPath === 'games')  return GAMES_PAGES;
    if (promptPath === 'tools')  return TOOLS_PAGES;
    return DIRECTORIES;
  }

  function findPageByName(name){
    return ALL_PAGES.find(p => p.name === name);
  }

  var root = document.getElementById('root');
  var linesEl = document.getElementById('lines');
  var promptRow = document.getElementById('promptRow');
  var promptLabelEl = document.getElementById('promptLabel');
  var typedTextEl = document.getElementById('typedText');
  var ghostEl = document.getElementById('ghost');
  var mobileInput = document.getElementById('mobileInput');

  var state = {
    lines: [],
    typed: '',
    phase: 'in',
    sel: -1,
    activeListGen: -1,
    showPrompt: false,
    ranOnce: false,
    out: false
  };

  var listGen = 0;
  var timers = [];

  // ---------- helpers ----------
  function rnd(n){ var s=''; for (var i=0;i<n;i++) s += GLYPHS[Math.floor(Math.random()*GLYPHS.length)]; return s; }
  function hashColor(w){ var h=0; for (var i=0;i<w.length;i++) h=(h*31+w.charCodeAt(i))>>>0; return COLORS[h % COLORS.length]; }
  function colorize(text){
    return text.split(/(\s+)/).filter(function(t){ return t.length; }).map(function(t){
      if (/^\s+$/.test(t)) return { t:t, c:PAL.fg };
      if (/^[.\/\\:;,(){}\[\]<>=+"'`~-]+$/.test(t)) return { t:t, c:PAL.dim };
      return { t:t, c:hashColor(t) };
    });
  }

  // ---------- rendering ----------
  function renderPromptRow(){
    promptRow.classList.toggle('hidden', !state.showPrompt);
    promptLabelEl.innerHTML = '';
    var prefixSpan = document.createElement('span');
    prefixSpan.textContent = 'user:';
    prefixSpan.style.color = PAL.green;
    var pathSpan = document.createElement('span');
    pathSpan.textContent = promptPath ? '/' + promptPath : '/home';
    pathSpan.style.color = promptPathColor;
    promptLabelEl.appendChild(prefixSpan);
    promptLabelEl.appendChild(pathSpan);
    promptLabelEl.appendChild(document.createTextNode(' '));
    typedTextEl.textContent = state.typed;
    ghostEl.textContent = (state.typed === '' && !state.ranOnce) ? "  type 'list' + \u21B5" : '';
  }

  function updateRootAnim(){
    root.classList.remove('in','out');
    if (state.out) root.classList.add('out');
    else if (state.phase === 'in') root.classList.add('in');
  }

  function scrollDown(){
    requestAnimationFrame(function(){ window.scrollTo(0, document.body.scrollHeight); });
  }

  function setSelHighlight(newSel){
    state.lines.forEach(function(ln){
      if (ln.pageIdx === undefined || ln.list !== state.activeListGen) return;
      if (ln.pageIdx === newSel) ln.el.style.background = 'rgba(54,249,246,0.09)';
      else ln.el.style.background = 'transparent';
    });
    state.sel = newSel;
  }

  // spans: [{t, c, w, sh}], extra: {click, pageIdx, cursor}, scramble: bool
  function pushLine(spans, extra, scramble){
    var line = Object.assign({
      spans: spans.map(function(s){
        return Object.assign({ w:400, sh:'none', disp: scramble ? rnd(s.t.length) : s.t }, s);
      })
    }, extra || {});

    var lineEl = document.createElement('div');
    lineEl.className = 'term-line';
    if (line.pageIdx !== undefined) lineEl.dataset.pageIdx = line.pageIdx;
    if (line.click){
      lineEl.classList.add('clickable');
      lineEl.addEventListener('click', line.click);
    }
    line.spans.forEach(function(sp){
      var spanEl = document.createElement('span');
      spanEl.textContent = sp.disp;
      spanEl.style.color = sp.c;
      spanEl.style.fontWeight = sp.w;
      spanEl.style.textShadow = sp.sh;
      lineEl.appendChild(spanEl);
      sp.el = spanEl;
    });
    line.el = lineEl;
    linesEl.appendChild(lineEl);
    state.lines.push(line);
    scrollDown();

    if (scramble){
      var f = 0, frames = 6;
      var iv = setInterval(function(){
        f++;
        line.spans.forEach(function(sp){
          var n = Math.ceil(sp.t.length * f / frames);
          sp.disp = sp.t.slice(0, n) + (f >= frames ? '' : rnd(sp.t.length - n));
          sp.el.textContent = sp.disp;
        });
        if (f >= frames) clearInterval(iv);
      }, 30);
      timers.push(iv);
    }
    return line;
  }
  function sys(text, c, extra){ return pushLine([{ t:text, c: c || PAL.dim }], extra); }

  function clearLines(){
    linesEl.innerHTML = '';
    state.lines = [];
    state.sel = -1;
    state.activeListGen = -1;
  }

  // ---------- boot sequence ----------
  function boot(){
    var seq = [
      [90,  function(){
        var spans = [
          { t:'import ', c:PAL.dim },
          { t:'AUDIO', c:PAL.yellow },
          { t:' / ', c:PAL.dim },
          { t:'CAMERA', c:PAL.orange },
          { t:' / ', c:PAL.dim },
          { t:'ART', c:PAL.pink },
          { t:' / ', c:PAL.dim },
          { t:'READ', c:PAL.purple },
          { t:' / ', c:PAL.dim },
          { t:'LEARN', c:PAL.cyan },
          { t:' / ', c:PAL.dim },
          { t:'HEALTH', c:PAL.green },
          { t:' / ', c:PAL.dim },
          { t:'GAMES', c:PAL.red },
          { t:' / ', c:PAL.dim },
          { t:'TOOLS', c:PAL.yellow }
        ];
        pushLine(spans, null, true);
      }],
      [220, function(){ sys('> File loaded: src/core/stay.js'); }],
      [160, function(){ pushLine(colorize('decrypt /vault/keys ............ OK'), null, true); }],
      [180, function(){ pushLine([{ t:'> ACCESS GRANTED', c:PAL.green, w:700, sh:'0 0 12px rgba(114,241,184,0.8)' }], null, true); }],
      [220, function(){ state.phase = 'ready'; state.showPrompt = true; renderPromptRow(); focusInput(); }]
    ];
    var t = 0;
    seq.forEach(function(entry){
      t += entry[0];
      timers.push(setTimeout(entry[1], t));
    });
  }

  // ---------- input ----------
  function focusInput(){ mobileInput.focus({ preventScroll:true }); }

  mobileInput.addEventListener('input', function(e){
    var v = e.target.value;
    if (v && state.phase === 'ready'){ state.typed += v; renderPromptRow(); }
    e.target.value = '';
  });

  function onKey(e){
    if (state.phase !== 'ready' || state.out || e.metaKey || e.ctrlKey || e.altKey) return;
    var linkLines = state.lines.filter(function(l){ return l.pageIdx !== undefined && l.list === state.activeListGen; });
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if (!linkLines.length) return;
      e.preventDefault();
      var idxs = linkLines.map(function(l){ return l.pageIdx; });
      var p = idxs.indexOf(state.sel);
      p = e.key === 'ArrowDown' ? (p+1) % idxs.length : (p-1+idxs.length) % idxs.length;
      setSelHighlight(idxs[p]);
    } else if (e.key === 'Enter'){
      e.preventDefault();
      var cmd = state.typed.trim();
      if (cmd){
        if (!state.ranOnce) {
          state.ranOnce = true;
          // Clear boot lines on first command
          var bootLines = state.lines.slice(0, 4);
          bootLines.forEach(function(line){ if (line.el) line.el.style.display = 'none'; });
        }
        state.typed=''; renderPromptRow(); run(cmd);
      }
      else if (state.sel >= 0) openPage(state.sel);
    } else if (e.key === 'Backspace'){
      e.preventDefault();
      state.typed = state.typed.slice(0, -1);
      renderPromptRow();
    } else if (e.key.length === 1){
      e.preventDefault();
      state.typed += e.key;
      renderPromptRow();
    }
  }
  window.addEventListener('keydown', onKey);

  root.addEventListener('click', focusInput);

  // Force refresh when back button is used
  window.addEventListener('popstate', function(){
    location.reload();
  });

  // ---------- commands ----------
  function echoCmd(cmd){
    pushLine([
      { t:'user:/', c:PAL.green },
      { t:promptPath + ' ', c:promptPathColor },
      { t:cmd, c:PAL.fg }
    ]);
  }

  function run(raw){
    echoCmd(raw);
    var cmd = raw.toLowerCase();
    var parts = cmd.split(/\s+/);
    var head = parts[0];
    var rest = parts.slice(1);
    var arg = rest.join(' ');
    var P = PAL;
    var num = parseInt(cmd, 10);

    // Try to find in current directory
    var byName = currentPages().findIndex(function(p){
      return p.name === cmd || (p.name === arg && (head === 'open' || head === 'cd' || head === 'go'));
    });

    // If in home and page not found in directories, try all pages
    var directPage = null;
    if (promptPath === '' && byName < 0) {
      directPage = findPageByName(cmd);
    }

    if (cmd === 'home' || cmd === 'cls') {
      promptPath = '';
      promptPathColor = PAL.yellow;
      renderPromptRow();
      return;
    }
    if (cmd === 'audio' || cmd === 'camera' || cmd === 'art' || cmd === 'read' || cmd === 'learn' || cmd === 'health' || cmd === 'games' || cmd === 'tools') {
      promptPath = cmd;
      promptPathColor = cmd === 'audio' ? PAL.yellow : cmd === 'camera' ? PAL.orange : cmd === 'learn' ? PAL.cyan : cmd === 'art' ? PAL.pink : cmd === 'read' ? PAL.purple : cmd === 'health' ? PAL.green : cmd === 'games' ? PAL.red : PAL.yellow;
      renderPromptRow();
      return showList();
    }
    if (cmd === '..') {
      promptPath = '';
      promptPathColor = PAL.yellow;
      renderPromptRow();
      return;
    }
    if (cmd === 'list' || cmd === 'ls' || cmd === 'dir') return showList();
    if (!isNaN(num) && num >= 1 && num <= currentPages().length && String(num) === cmd) return openPage(num - 1);
    if (byName >= 0) return openPage(byName);
    if (directPage) return openPageDirect(directPage);

    switch (head){
      case 'help':
        sys('\u2500\u2500 commands \u2500\u2500', P.purple);
        [['list','show directories or pages'],['open <name|#>','jump to a page'],
         ['..',  'back to home'],['about','what is this place'],
         ['contact','reach out'],['clear','wipe the screen'],
         ['reload','refresh reality'],['exit','try it']].forEach(function(pair){
          pushLine([{ t:'  ' + pair[0].padEnd(16), c:P.cyan }, { t:pair[1], c:P.dim }]);
        });
        return;
      case 'clear': return clearLines();
      case 'about':
        sys('no credits. no copyrights. power to the people.', P.pink);
        return;
      case 'contact':
        sys('text 305-491-4562', P.cyan);
        return;
      case 'sudo': return sys('permission denied. nice try, root.', P.red);
      case 'reload':
        sys('reloading reality...', P.orange);
        setTimeout(function(){ location.reload(); }, 600);
        return;
      case 'exit': case 'quit': case 'logout': return sys('there is no exit. stay.', P.red);
      case 'echo': return pushLine(colorize(arg || '...'));
      case 'date': case 'time': return sys(new Date().toString(), P.green);
      case 'rm': return sys('these files are load-bearing. denied.', P.red);
      case 'matrix': return sys('wake up... this terminal IS the matrix.', P.green);
      case 'open': case 'cd': case 'go':
        return sys('no page called "' + arg + '" \u2014 type list', P.red);
    }
    sys('command not found: ' + head + ' \u2014 type help', P.red);
  }

  function lookingOut(){
    pushLine([{ t:'LOOKING OUT.', c:PAL.cyan, w:700, sh:'0 0 14px rgba(54,249,246,0.9), 0 0 44px rgba(255,126,219,0.6)' }], null, true);
  }

  function showList(){
    var gen = ++listGen;
    var pages = currentPages();
    var isHome = promptPath === '';
    sys('\u2500\u2500 ' + (isHome ? 'directories' : 'pages') + ' \u2500\u2500', PAL.purple);
    pages.forEach(function(p, i){
      pushLine([
        { t:'  ' + (i+1) + '  ', c:PAL.dim },
        { t:p.name.padEnd(10), c:p.color || COLORS[i % COLORS.length], w:500 },
        { t:p.desc, c:PAL.dim }
      ], { pageIdx:i, list:gen, click:function(){ isHome ? cdDir(i) : openPage(i); }, cursor:'pointer' });
    });
    sys('\u2191\u2193 + enter, click, or type a name' + (isHome ? '' : ' / number'), PAL.dim);
    state.activeListGen = gen;
    setSelHighlight(0);
  }

  function cdDir(i){
    var dir = DIRECTORIES[i];
    if (!dir) return;
    promptPath = dir.name;
    promptPathColor = dir.name === 'audio' ? PAL.yellow : dir.name === 'camera' ? PAL.orange : dir.name === 'learn' ? PAL.cyan : dir.name === 'art' ? PAL.pink : dir.name === 'read' ? PAL.purple : dir.name === 'health' ? PAL.green : dir.name === 'games' ? PAL.red : PAL.yellow;
    renderPromptRow();
    showList();
  }

  function openPage(i){
    var p = currentPages()[i];
    if (!p) return;
    if (p.url === '#') return sys('// "' + p.name + '" is an empty slot \u2014 give me its URL', PAL.orange);
    sys('> jacking into ' + p.name + ' ...', PAL.cyan);
    state.out = true;
    updateRootAnim();
    setTimeout(function(){ window.location.href = p.url; }, 520);
  }

  function openPageDirect(p){
    if (!p) return;
    if (p.url === '#') return sys('// "' + p.name + '" is an empty slot \u2014 give me its URL', PAL.orange);
    sys('> jacking into ' + p.name + ' ...', PAL.cyan);
    state.out = true;
    updateRootAnim();
    setTimeout(function(){ window.location.href = p.url; }, 520);
  }

  // Keep the prompt above the on-screen keyboard on mobile: when the
  // keyboard opens/closes the visual viewport resizes, so re-pin to bottom.
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){
      if (state.phase === 'ready' && !state.out) scrollDown();
    });
  }

  // ---------- go ----------
  updateRootAnim();
  renderPromptRow();
  timers.push(setTimeout(function(){
    boot();
  }, 950));

})();
</script>
</body>
</html>
